[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scientific-parallax"
version = "0.3.0"
description = "Auditable experiments for paradigm-question co-evolution"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Scientific Parallax contributors" }]
dependencies = [
  "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
scientific-parallax = "scientific_parallax.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scientific_parallax"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["scientific_parallax"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
