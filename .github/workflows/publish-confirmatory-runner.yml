name: Publish confirmatory runner

on:
  push:
    tags:
      - "runner-v*"

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve runner version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#runner-v}" >> "$GITHUB_OUTPUT"

      - name: Enable cross-platform builds
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Configure Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable runner
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Containerfile.confirmatory
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/ryanchromium/scientific-parallax-confirmatory:${{ steps.version.outputs.value }}
            ghcr.io/ryanchromium/scientific-parallax-confirmatory:git-${{ github.sha }}

      - name: Write public digest record
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os

          record = {
              "schema_version": 1,
              "image": "ghcr.io/ryanchromium/scientific-parallax-confirmatory",
              "digest": os.environ["IMAGE_DIGEST"],
              "platforms": ["linux/amd64", "linux/arm64"],
              "source_revision": os.environ["GITHUB_SHA"],
              "source_ref": os.environ["GITHUB_REF_NAME"],
              "version": os.environ["IMAGE_VERSION"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
          }
          with open("runner-digest.json", "w", encoding="utf-8") as stream:
              json.dump(record, stream, indent=2, sort_keys=True)
              stream.write("\n")
          PY

      - name: Publish digest as release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" runner-digest.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "Confirmatory runner ${{ steps.version.outputs.value }}" \
            --notes "Immutable multi-platform confirmatory runner digest for Protocol Freeze review."
